<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP Monitor — Orca Whirlpools</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d3644;
    --text: #e6edf3; --muted: #8b96a5; --accent: #58a6ff;
    --green: #3fb970; --red: #f85149; --yellow: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input, button, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 15px;
  }
  input:focus { outline: 1px solid var(--accent); }
  #wallet { flex: 1; min-width: 280px; font-family: ui-monospace, monospace; }
  button.primary { background: #1f6feb; border-color: #1f6feb; cursor: pointer; font-weight: 600; }
  button.primary:hover { background: #2a7aff; }
  button:disabled { opacity: .5; cursor: wait; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px; margin: 20px 0; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat .lbl { color: var(--muted); font-size: 12px; }
  .stat .val { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; margin-bottom: 18px; }
  .card h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
  .badge.in { background: #12341f; color: var(--green); }
  .badge.out { background: #3d2300; color: var(--yellow); }
  .addr { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; word-break: break-all; margin: 4px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 12px 0; }
  .kv { background: var(--panel2); border-radius: 8px; padding: 10px 12px; }
  .kv .lbl { color: var(--muted); font-size: 12px; }
  .kv .val { font-weight: 600; margin-top: 2px; }
  .kv .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .rangebar { position: relative; height: 34px; background: var(--panel2); border-radius: 8px; margin: 14px 0 4px; overflow: hidden; }
  .rangebar .band { position: absolute; top: 0; bottom: 0; background: #1f4f76; opacity: .85; }
  .rangebar .cur { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
  .rangelbl { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  details.sim { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
  details.sim summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  .simform { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; align-items: end; }
  .simform label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  .simform input { width: 130px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .quick button { font-size: 12px; padding: 5px 10px; cursor: pointer; border-radius: 20px; }
  .quick button:hover { border-color: var(--accent); }
  table.simres { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  table.simres td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.simres td:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  table.simres tr.total td { border-top: 2px solid var(--border); font-weight: 700; }
  .notes { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .notes li { margin-bottom: 4px; }
  .tabs { display: flex; gap: 8px; margin: 16px 0; }
  .tabs button { cursor: pointer; border-radius: 20px; padding: 8px 18px; font-weight: 600; }
  .tabs button.active { background: #1f6feb; border-color: #1f6feb; }
  table.jrnl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.jrnl th { text-align: left; color: var(--muted); font-size: 12px; font-weight: 600;
    padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.jrnl td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.jrnl td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .jbadge { font-size: 11.5px; padding: 2px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .jbadge.deposit { background: #12341f; color: var(--green); }
  .jbadge.withdraw { background: #3d1418; color: var(--red); }
  .jbadge.open, .jbadge.increase { background: #1c2b40; color: var(--accent); }
  .jbadge.close, .jbadge.decrease { background: #3d2300; color: var(--yellow); }
  .jbadge.collect { background: #10333a; color: #46c8d8; }
  .jbadge.swap { background: #2b1d3a; color: #c792ea; }
  .jbadge.other { background: var(--panel2); color: var(--muted); }
  td.cmt { cursor: pointer; min-width: 180px; max-width: 340px; color: var(--text); }
  td.cmt .empty { opacity: .45; }
  td.cmt textarea { width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px; font: inherit; }
  .err { background: #3d1418; border: 1px solid var(--red); color: #ffb3ad;
    border-radius: 8px; padding: 12px; margin: 14px 0; white-space: pre-wrap; }
  .market { display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin: 16px 0 6px; font-size: 13.5px; color: var(--muted); }
  .market b { color: var(--text); }
  .regime { font-weight: 700; padding: 2px 10px; border-radius: 20px; font-size: 12.5px; }
  .regime.calm { background: #12341f; color: var(--green); }
  .regime.normal { background: #1c2b40; color: var(--accent); }
  .regime.trend-up { background: #10333a; color: #46c8d8; }
  .regime.risk-off, .regime.storm { background: #3d1418; color: var(--red); }
  .advice { display: flex; gap: 10px; border-radius: 10px; padding: 12px 14px; margin: 12px 0;
    font-size: 14px; line-height: 1.45; border: 1px solid; }
  .advice.low { background: #14231a; border-color: #2a5c3f; }
  .advice.medium { background: #33270e; border-color: #7a5c1e; }
  .advice.high { background: #3d1418; border-color: var(--red); }
  .advice .icon { font-size: 18px; }
  .advice .a-action { font-weight: 700; }
  .advice .a-give { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .advgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; margin: 12px 0; }
  .advgrid .advice { margin: 0; }
  .advice.rec { outline: 2px solid var(--accent); }
  .a-risk { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px; }
  .tfrow { display: flex; gap: 6px; margin: 12px 0 6px; }
  .tfrow button { font-size: 12px; padding: 4px 10px; cursor: pointer; border-radius: 20px; }
  .tfrow button.active { background: #1f6feb; border-color: #1f6feb; }
  .chartbox { height: 400px; }
  .chartnote { color: var(--muted); font-size: 12.5px; margin: 8px 0; }
  .loading { color: var(--muted); margin: 20px 0; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌊 LP Monitor — Orca Whirlpools</h1>
  <div class="sub">Мониторинг концентрированных позиций: состав, pending yield, PnL и симуляция ребаланса</div>

  <div class="row">
    <input id="wallet" placeholder="Паблик-адрес кошелька (Solana)" spellcheck="false">
    <button class="primary" id="load">Загрузить</button>
    <select id="refreshSel" title="Интервал автообновления">
      <option value="0">без обновления</option>
      <option value="30">30 сек</option>
      <option value="60">1 мин</option>
      <option value="300">5 мин</option>
      <option value="900">15 мин</option>
    </select>
    <span id="updatedAt" style="align-self:center;color:var(--muted);font-size:12px"></span>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="positions" class="active">Позиции</button>
    <button data-tab="journal">Журнал</button>
  </div>

  <div id="tab-positions">
    <div id="out"></div>
  </div>
  <div id="tab-journal" hidden>
    <div id="journalout"><div class="chartnote">Введи кошелёк и открой вкладку — журнал соберётся из истории транзакций.</div></div>
  </div>
</div>

<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const out = $("#out");
const walletInput = $("#wallet");
// ?wallet=… в URL (для бота/шаринга) имеет приоритет над сохранённым.
walletInput.value = new URLSearchParams(location.search).get("wallet") ||
  localStorage.getItem("lpmon_wallet") || "";

const fmtUsd = (v, d = 2) => v == null ? "н/д" :
  (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("ru-RU", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtSigned = (v, d = 2) => v == null ? "н/д" :
  (v >= 0 ? "+" : "−") + "$" + Math.abs(v).toLocaleString("ru-RU", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtNum = (v, d = 6) => v == null ? "н/д" :
  Number(v.toFixed(d)).toLocaleString("ru-RU", { maximumFractionDigits: d });
const fmtPct = (v, d = 2) => v == null ? "н/д" : v.toFixed(d) + "%";
const cls = v => v == null ? "" : v >= 0 ? "pos" : "neg";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("#load").onclick = () => ($("#tab-journal").hidden ? load() : loadJournal());
walletInput.addEventListener("keydown", e => { if (e.key === "Enter") load(); });

// ── Автообновление ──
const refreshSel = $("#refreshSel");
refreshSel.value = localStorage.getItem("lpmon_refresh") ?? "60";
let refreshTimer = null;
let refreshing = false;

function applyRefresh() {
  localStorage.setItem("lpmon_refresh", refreshSel.value);
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = null;
  const sec = Number(refreshSel.value);
  if (sec > 0) refreshTimer = setInterval(refreshTick, sec * 1000);
}
refreshSel.onchange = applyRefresh;

async function refreshTick() {
  if (refreshing || document.hidden) return; // не накладываемся и не молотим в фоновой вкладке
  refreshing = true;
  try {
    if (!walletInput.value.trim()) return;
    if (!$("#tab-journal").hidden) await loadJournal(true);
    else await load(true);
  } finally {
    refreshing = false;
  }
}
applyRefresh();

// ── Вкладки ──
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  for (const el of document.querySelectorAll("#tabs button"))
    el.classList.toggle("active", el === b);
  $("#tab-positions").hidden = b.dataset.tab !== "positions";
  $("#tab-journal").hidden = b.dataset.tab !== "journal";
  if (b.dataset.tab === "journal" && walletInput.value.trim()) loadJournal();
});

function stampUpdated() {
  $("#updatedAt").textContent = "обновлено " + new Date().toLocaleTimeString("ru-RU");
}

const fmtSignedPct = (v, d = 2) => v == null ? "н/д" :
  (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d) + "%";

// ── Журнал сделок ──
const JTYPE_RU = {
  deposit: "поступление", withdraw: "вывод", swap: "свап", open: "вход LP",
  increase: "довнесение", decrease: "изъятие", close: "выход LP",
  collect: "сбор комиссий", other: "прочее",
};

async function loadJournal(silent = false) {
  const wallet = walletInput.value.trim();
  if (!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(wallet)) return;
  const jo = $("#journalout");
  // Не перерисовываем, пока открыт редактор комментария.
  if (silent && jo.querySelector("textarea")) return;
  if (!silent && !jo.querySelector("table"))
    jo.innerHTML = '<div class="loading"><span class="spin">⟳</span> Загружаю журнал…</div>';
  try {
    const res = await fetch(`/api/journal?wallet=${wallet}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    jo.innerHTML = renderJournal(data);
    stampUpdated();
  } catch (e) {
    if (silent) console.warn("журнал:", e);
    else jo.innerHTML = `<div class="err">Ошибка журнала: ${esc(e.message || e)}</div>`;
  }
}

function renderJournal(d) {
  const b = d.balance;
  let html = `<div class="summary">
    <div class="stat"><div class="lbl">Баланс (кошелёк + позиции + несобранные fee)</div>
      <div class="val">${b ? fmtUsd(b.totalUsd) : "н/д"}</div>
      ${b ? `<div class="lbl">кошелёк ${fmtUsd(b.walletUsd, 0)} · позиции ${fmtUsd(b.positionsUsd, 0)} · fee ${fmtUsd(b.pendingUsd)}</div>` : '<div class="lbl">появится после загрузки «Позиций»</div>'}</div>
    <div class="stat"><div class="lbl">Чистая прибыль с начала</div>
      <div class="val ${cls(d.pnlSinceStartUsd)}">${fmtSigned(d.pnlSinceStartUsd)}</div>
      <div class="lbl">внесено нетто: ${fmtUsd(d.netDepositedUsd)}</div></div>
    <div class="stat"><div class="lbl">За 7 дней</div>
      <div class="val ${cls(d.changes.d7)}">${fmtSigned(d.changes.d7)}</div></div>
    <div class="stat"><div class="lbl">За 30 дней</div>
      <div class="val ${cls(d.changes.d30)}">${fmtSigned(d.changes.d30)}</div></div>
  </div>`;

  if (d.syncing)
    html += `<div class="chartnote"><span class="spin">⟳</span> Синхронизация истории… обработано транзакций: ${d.processed}. Журнал пополняется, обнови через минуту.</div>`;
  if (d.syncError)
    html += `<div class="err">Синк прервался: ${esc(d.syncError)} — продолжится при следующем обновлении.</div>`;

  if (!d.events.length) {
    html += '<div class="card">Событий пока нет.</div>';
    return html;
  }

  const rows = d.events.map((e, i) => {
    const dt = e.blockTime ? new Date(e.blockTime * 1000).toLocaleString("ru-RU",
      { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
    const parts = [];
    if (Math.abs(e.solDelta) > 1e-9)
      parts.push(`<span class="${cls(e.solDelta)}">${e.solDelta > 0 ? "+" : ""}${fmtNum(e.solDelta, 4)} SOL</span>`);
    for (const [sym, v] of Object.entries(e.tokenDeltas ?? {}))
      parts.push(`<span class="${cls(v)}">${v > 0 ? "+" : ""}${fmtNum(v, 2)} ${esc(sym)}</span>`);
    const range = e.range ? `${fmtNum(e.range.lower, 2)} — ${fmtNum(e.range.upper, 2)}` : "—";
    // Δ шага — разница соседних снимков баланса; события идут новые → старые,
    // у самого первого события предыдущий баланс — ноль.
    const ba = e.balanceAfterUsd;
    const prevBa = i + 1 < d.events.length ? d.events[i + 1].balanceAfterUsd : 0;
    const step = ba != null && prevBa != null ? ba - prevBa : null;
    const bdTxt = step == null ? "н/д" : Math.abs(step) < 0.005 ? "0.00" : fmtSigned(step);
    const bdCls = step == null || Math.abs(step) < 0.005 ? "" : cls(step);
    // Итог LP-эпизода (вход→выход) — подписью на строке выхода.
    const episode = e.type === "close" && e.balanceDeltaUsd != null
      ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">эпизод: <b class="${cls(e.balanceDeltaUsd)}">${fmtSigned(e.balanceDeltaUsd)}</b></div>`
      : "";
    const cmt = e.comment
      ? esc(e.comment)
      : '<span class="empty">＋ комментарий…</span>';
    return `<tr>
      <td class="num">${dt}</td>
      <td><span class="jbadge ${e.type}">${JTYPE_RU[e.type] ?? e.type}</span>${
        e.groupedTypes?.length
          ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">вкл. ${[...new Set(e.groupedTypes)].map(t => JTYPE_RU[t] ?? t).join(", ")}</div>`
          : ""
      }</td>
      <td>${parts.join("<br>") || "—"}${e.valueUsd != null ? `<br><span style="color:var(--muted)">≈ ${fmtUsd(e.valueUsd)}</span>` : ""}</td>
      <td class="num ${bdCls}">${bdTxt}${episode}</td>
      <td class="num">${ba == null ? "н/д" : fmtUsd(ba, 2)}</td>
      <td class="num">${range}</td>
      <td class="num">${e.priceUsd != null ? "$" + fmtNum(e.priceUsd, 2) : "—"}</td>
      <td class="num">${e.feeSol != null ? fmtNum(e.feeSol, 6) : "—"}</td>
      <td class="cmt" data-sig="${esc(e.signature)}" data-comment="${esc(e.comment ?? "")}">${cmt}</td>
    </tr>`;
  }).join("");

  html += `<div class="card" style="overflow-x:auto"><table class="jrnl">
    <tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Δ баланса, $</th><th>Баланс, $</th><th>Диапазон</th><th>Цена SOL</th><th>Fee, SOL</th><th>Комментарий</th></tr>
    ${rows}
  </table></div>`;
  return html;
}

// Инлайн-редактирование комментария
$("#journalout").addEventListener("click", async e => {
  const cell = e.target.closest("td.cmt");
  if (!cell || cell.querySelector("textarea")) return;
  const sig = cell.dataset.sig;
  const cur = cell.dataset.comment || "";
  cell.innerHTML = `<textarea rows="2" placeholder="Почему принято решение…"></textarea>
    <button class="primary" style="margin-top:4px;font-size:12px;padding:4px 12px">Сохранить</button>`;
  const ta = cell.querySelector("textarea");
  ta.value = cur;
  ta.focus();
  cell.querySelector("button").onclick = async ev => {
    ev.stopPropagation();
    try {
      const res = await fetch("/api/journal/comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallet: walletInput.value.trim(), signature: sig, comment: ta.value }),
      });
      if (!res.ok) throw new Error((await res.json()).error || res.statusText);
      cell.dataset.comment = ta.value;
      cell.innerHTML = ta.value ? esc(ta.value) : '<span class="empty">＋ комментарий…</span>';
    } catch (err) {
      alert("Не сохранилось: " + (err.message || err));
    }
  };
});

async function load(silent = false) {
  const wallet = walletInput.value.trim();
  if (!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(wallet)) {
    if (!silent) out.innerHTML = '<div class="err">Введите корректный адрес кошелька Solana.</div>';
    return;
  }
  localStorage.setItem("lpmon_wallet", wallet);
  $("#load").disabled = true;
  if (!silent)
    out.innerHTML = '<div class="loading"><span class="spin">⟳</span> Загружаю позиции, историю и статистику пулов… (10–60 сек на публичном RPC)</div>';
  try {
    const res = await fetch(`/api/positions?wallet=${wallet}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    render(data);
    stampUpdated();
  } catch (e) {
    if (silent) console.warn("автообновление позиций:", e);
    else out.innerHTML = `<div class="err">Ошибка: ${esc(e.message || e)}</div>`;
  } finally {
    $("#load").disabled = false;
  }
}

const REGIME_RU = { "risk-off": "RISK-OFF", storm: "ШТОРМ", "trend-up": "ТРЕНД ВВЕРХ", calm: "ШТИЛЬ", normal: "НЕЙТРАЛЬНО" };

function marketBar(m) {
  if (!m) return "";
  const ta = m.ta;
  let taRow = "";
  if (ta) {
    const emaPos = m.price < ta.ema200 ? `ниже EMA200 (${ta.ema200.toFixed(1)}) 🐻` :
      m.price > ta.ema50 ? `выше EMA50 (${ta.ema50.toFixed(1)})` : `между EMA50/200`;
    const sup = ta.supports.map(l => `${l.price.toFixed(1)}<span style="opacity:.6">×${l.touches}</span>`).join(", ") || "—";
    const res = ta.resistances.map(l => `${l.price.toFixed(1)}<span style="opacity:.6">×${l.touches}</span>`).join(", ") || "—";
    taRow = `<div class="market" style="margin-top:6px">
      <span>RSI: <b>${ta.rsi14.toFixed(0)}</b></span>
      <span>ATR: <b>${ta.atrPct.toFixed(1)}%/д</b></span>
      <span><b>${emaPos}</b></span>
      <span>POC 90д: <b>${ta.poc.toFixed(1)}</b></span>
      <span style="color:var(--green)">поддержки: <b>${sup}</b></span>

function adviceBlock(a) {

function advGrid(list) {

// ── Свечной график в карточке позиции ──
const STABLES = new Set(["USDC", "USDT", "USDH", "PYUSD"]);
const CHART_BASES = new Set(["SOL", "ETH", "BTC"]);
const TF_RU = { "1h": "1ч", "4h": "4ч", "1d": "1д", "1w": "1н", "1M": "1М" };

// Продукт Coinbase по паре: не-стейбл токен против USD; без стейбла в паре — нет графика.
function productFor(p) {
  const a = p.tokenA.symbol, b = p.tokenB.symbol;
  const base = STABLES.has(a) ? b : STABLES.has(b) ? a : null;
  return base && CHART_BASES.has(base) ? base + "-USD" : null;
}

function chartSection(p) {
  if (!productFor(p)) return '<div class="chartnote">Свечной график недоступен для этой пары</div>';
  return `<div class="tfrow" data-role="tfs">
    ${Object.keys(TF_RU).map(tf => `<button data-tf="${tf}"${tf === "1d" ? ' class="active"' : ""}>${TF_RU[tf]}</button>`).join("")}
  </div>
  <div class="chartbox" data-role="chart"></div>`;
}

function initChart(p) {
  const product = productFor(p);
  const card = document.getElementById("card-" + p.positionAddress);
  if (!product || !card || !window.LightweightCharts) return;
  const el = card.querySelector('[data-role="chart"]');
  if (!el) return;

  const chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { type: "solid", color: "transparent" }, textColor: "#8b96a5", attributionLogo: false },
    grid: { vertLines: { color: "#1c2330" }, horzLines: { color: "#1c2330" } },
    timeScale: { timeVisible: true, borderColor: "#2d3644" },
    rightPriceScale: { borderColor: "#2d3644" },
  });
  const series = chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: "#3fb970", downColor: "#f85149",
    wickUpColor: "#3fb970", wickDownColor: "#f85149", borderVisible: false,
  });

  let levelsDrawn = false;
  async function setTf(tf) {
    const res = await fetch(`/api/candles?product=${product}&tf=${tf}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    series.setData(data.candles);
    // Стартовый зум: плотные таймфреймы показываем не целиком (год в упор —
    // каша), а последним окном; вся история доступна скроллом влево.
    // На узком экране (мобильная вёрстка, скриншот бота) окно короче:
    // 1д — последние 30 дней, иначе свечи слишком мелкие.
    const narrow = el.clientWidth > 0 && el.clientWidth < 700;
    const visible = (narrow
      ? { "1h": 72, "4h": 90, "1d": 30 }
      : { "1h": 168, "4h": 180, "1d": 120 })[tf];
    if (visible && data.candles.length > visible) {
      chart.timeScale().setVisibleLogicalRange({
        from: data.candles.length - visible,
        to: data.candles.length + 3,
      });
    } else {
      chart.timeScale().fitContent();
    }
    if (!levelsDrawn) {
      levelsDrawn = true;
      // Без title: текст на полотне закрывал свечи. Уровень видно по цветной
      // метке с ценой на правой оси (зелёный — поддержка, жёлтый —
      // сопротивление, синий — границы позиции).
      const line = (price, color, style) =>
        series.createPriceLine({ price, color, lineWidth: 1, lineStyle: style, axisLabelVisible: true });
      for (const l of data.levels.supports) line(l.price, "#3fb970", LightweightCharts.LineStyle.Dashed);
      for (const l of data.levels.resistances) line(l.price, "#d29922", LightweightCharts.LineStyle.Dashed);
      line(p.lowerPrice, "#58a6ff", LightweightCharts.LineStyle.Solid);
      line(p.upperPrice, "#58a6ff", LightweightCharts.LineStyle.Solid);
    }
  }

  card.querySelector('[data-role="tfs"]').addEventListener("click", e => {
    const b = e.target.closest("button[data-tf]");
    if (!b) return;
    for (const x of e.currentTarget.querySelectorAll("button")) x.classList.toggle("active", x === b);
    setTf(b.dataset.tf).catch(err => console.warn("chart:", err));
  });

  setTf("1d").catch(err => {
    el.outerHTML = `<div class="err">График: ${esc(err.message || err)} (первая загрузка истории может занять ~30 сек — обнови страницу)</div>`;
  });
}

function render(data) {
  const ps = data.positions.filter(p => !p.error);
  const errs = data.positions.filter(p => p.error);
  if (ps.length === 0 && errs.length === 0) {
    out.innerHTML = marketBar(data.market) +
      (advGrid(data.walletAlternatives) || adviceBlock(data.walletAdvice)) +
      '<div class="card">На этом кошельке позиций Orca Whirlpools не найдено.</div>';
    return;
  }
  // Суммируем по позициям, у которых значение посчитано; если ни одной — н/д.
  const sum = (f) => {
    const vals = ps.map(f).filter(v => v != null);
    return vals.length ? vals.reduce((a, b) => a + b, 0) : null;
  };
  const totalValue = sum(p => p.valueUsd);
  const totalYield = sum(p => p.pendingYieldUsd);
  const totalPnl = sum(p => p.pnl?.totalPnlUsd);
  const totalHodl = sum(p => p.pnl?.vsHodlUsd);

  let html = `<div class="summary">
    <div class="stat"><div class="lbl">Стоимость позиций</div><div class="val">${fmtUsd(totalValue)}</div></div>
    <div class="stat"><div class="lbl">Pending yield</div><div class="val ${cls(totalYield)}">${fmtUsd(totalYield, 4)}</div></div>
    <div class="stat"><div class="lbl">PnL всего</div><div class="val ${cls(totalPnl)}">${fmtSigned(totalPnl)}</div></div>
    <div class="stat"><div class="lbl">PnL против HODL</div><div class="val ${cls(totalHodl)}">${fmtSigned(totalHodl)}</div></div>
  </div>`;

  html += ps.map(p => renderPosition(p, data.market)).join("");
  html += errs.map(p => `<div class="err">Позиция ${esc(p.positionAddress)}: ${esc(p.error)}</div>`).join("");
  out.innerHTML = html;

  for (const p of ps) { bindSim(p); initChart(p); }
}

// Средняя цена входа: из суммарного состава депозитов (A, B) и фиксированных
// границ диапазона. B/A = b·s·(s−a)/(b−s), где s=√P, a=√Pl, b=√Pu →
// квадратное уравнение b·s² + (r−ab)·s − r·b = 0.
function entryPrice(p) {
  const d = p.pnl;
  if (!d || d.depositedA == null || d.depositedB == null) return null;
  const A = d.depositedA, B = d.depositedB;
  if (A <= 0 && B <= 0) return null;
  if (A <= 0) return p.upperPrice; // весь вход в токене B — цена была выше диапазона
  if (B <= 0) return p.lowerPrice; // весь вход в токене A — цена была ниже диапазона
  const a = Math.sqrt(p.lowerPrice), b = Math.sqrt(p.upperPrice);
  const r = B / A;
  const s = (-(r - a * b) + Math.sqrt((r - a * b) ** 2 + 4 * r * b * b)) / (2 * b);
  const P = s * s;
  return Number.isFinite(P) && P > 0 ? P : null;
}

function renderPosition(p, market) {
  const inRange = p.status === "priceInRange";
  const statusTxt = inRange ? "в диапазоне" :
    p.status === "priceBelowRange" ? "цена ниже диапазона" : "цена выше диапазона";

  // Видимая шкала: диапазон + запас 25% ширины с каждой стороны, цена зажимается в края.
  const w = p.upperPrice - p.lowerPrice;
  const vMin = p.lowerPrice - w * .25, vMax = p.upperPrice + w * .25;
  const pct = v => Math.min(99.5, Math.max(.5, (v - vMin) / (vMax - vMin) * 100));

  // Метки уровней поддержки/сопротивления на шкале (для пулов с котировкой в USD)
  let levelTicks = "";
  if (market?.ta) {
    for (const l of [...market.ta.supports, ...market.ta.resistances]) {
      if (l.price > vMin && l.price < vMax) {
        const color = l.price < market.price ? "var(--green)" : "var(--yellow)";
        levelTicks += `<div title="${l.price < market.price ? "поддержка" : "сопротивление"} ${l.price.toFixed(1)} (${l.touches} касаний)"
          style="position:absolute;top:0;bottom:0;width:0;border-left:2px dashed ${color};left:${pct(l.price)}%"></div>`;
      }
    }
  }

  const pnl = p.pnl;
  const rewards = p.pendingRewards.map(r =>
    `${fmtNum(r.uiAmount)} ${esc(r.symbol)} (${fmtUsd(r.usd, 4)})`).join(", ");

  // Расчётный fee позиции за 24ч: доля в активной ликвидности × комиссии пула.
  const dailyFeesUsd = p.pool?.fees24hUsd != null && p.shareOfPoolPct != null
    ? p.pool.fees24hUsd * p.shareOfPoolPct / 100
    : null;

  // Отметка цены входа на шкале
  const entry = entryPrice(p);
  const entryTick = entry != null && entry > vMin && entry < vMax
    ? `<div title="цена входа ~${fmtNum(entry, 4)}"
        style="position:absolute;top:0;bottom:0;width:0;border-left:2px dotted #c792ea;left:${pct(entry)}%"></div>`
    : "";

  return `<div class="card" id="card-${p.positionAddress}">
    <h2>${esc(p.pair)} · ${p.feeRatePct}% <span class="badge ${inRange ? "in" : "out"}">${statusTxt}</span></h2>
    <div class="addr">${esc(p.positionAddress)}</div>
    ${solMarketRows(p, market)}
    ${advGrid(p.alternatives) || adviceBlock(p.advice)}

    <div class="rangebar">
      <div class="band" style="left:${pct(p.lowerPrice)}%; width:${pct(p.upperPrice) - pct(p.lowerPrice)}%"></div>
      ${levelTicks}
      ${entryTick}
      <div class="cur" style="left:${pct(p.currentPrice)}%"></div>
    </div>
    <div class="rangelbl">
      <span>${fmtNum(p.lowerPrice, 4)}</span>
      <span>цена: <b style="color:var(--text)">${fmtNum(p.currentPrice, 4)}</b>${entry != null ? ` · вход: <b style="color:#c792ea">${fmtNum(entry, 4)}</b>` : ""}</span>
      <span>${fmtNum(p.upperPrice, 4)}</span>
    </div>

    ${chartSection(p)}

    <div class="grid">
      <div class="kv"><div class="lbl">Стоимость позиции</div>
        <div class="val">${fmtUsd(p.valueUsd)}</div>
        <div class="hint">${fmtNum(p.tokenA.uiAmount, 4)} ${esc(p.tokenA.symbol)} + ${fmtNum(p.tokenB.uiAmount, 2)} ${esc(p.tokenB.symbol)}</div></div>
      <div class="kv"><div class="lbl">Pending yield (не собрано)</div>
        <div class="val ${cls(p.pendingYieldUsd)}">${fmtUsd(p.pendingYieldUsd, 4)}</div>
        <div class="hint">${fmtNum(p.pendingFees.tokenA.uiAmount, 6)} ${esc(p.tokenA.symbol)} + ${fmtNum(p.pendingFees.tokenB.uiAmount, 4)} ${esc(p.tokenB.symbol)}${rewards ? " · реварды: " + rewards : ""}</div></div>
      <div class="kv"><div class="lbl">Оценка APR позиции (24ч)</div>
        <div class="val">${fmtPct(p.pool?.positionFeeAprPct, 1)}</div>
        <div class="hint">доля в активной ликвидности: ${p.shareOfPoolPct == null ? "—" : fmtPct(p.shareOfPoolPct, 3)}</div></div>
      <div class="kv"><div class="lbl">Пул</div>
        <div class="val">${fmtUsd(p.pool?.tvlUsd, 0)} TVL</div>
        <div class="hint">объём 24ч ${fmtUsd(p.pool?.volume24hUsd, 0)} · комиссии 24ч ${fmtUsd(p.pool?.fees24hUsd, 0)}</div></div>
    </div>

    ${pnl ? `<div class="grid">
      <div class="kv"><div class="lbl">Вложено (историч.)</div>
        <div class="val">${fmtUsd(pnl.depositedValueUsd)}</div>
        <div class="hint">${pnl.ageDays != null ? "возраст: " + pnl.ageDays.toFixed(1) + " дн." : ""}</div></div>
      <div class="kv"><div class="lbl">Расчётный fee за 24ч</div>
        <div class="val ${cls(dailyFeesUsd)}">${fmtUsd(dailyFeesUsd, 4)}</div>
        <div class="hint">собрано+выведено: ${fmtUsd(pnl.collectedYieldUsd + pnl.withdrawnValueUsd)} · сеть: ${pnl.txFeesSol.toFixed(5)} SOL</div></div>
      <div class="kv"><div class="lbl">PnL всего</div>
        <div class="val ${cls(pnl.totalPnlUsd)}">${fmtSigned(pnl.totalPnlUsd)}</div>
        <div class="hint">реализованная доходность: ${pnl.realizedAprPct == null ? "н/д" : pnl.realizedAprPct.toFixed(1) + "% годовых"}</div></div>
      <div class="kv"><div class="lbl">PnL против HODL</div>
        <div class="val ${cls(pnl.vsHodlUsd)}">${fmtSigned(pnl.vsHodlUsd)}</div>
        <div class="hint">включая импермалосс</div></div>
    </div>
    ${pnl.note ? `<div class="notes">ⓘ ${esc(pnl.note)}</div>` : ""}` : ""}

    <details class="sim">
      <summary>⚖️ Симуляция ребаланса</summary>
      <div class="quick" data-role="quick">
        <button data-mode="shift" data-v="-10">⬇ сдвиг −10%</button>
        <button data-mode="shift" data-v="-5">⬇ сдвиг −5%</button>
        <button data-mode="shift" data-v="5">⬆ сдвиг +5%</button>
        <button data-mode="shift" data-v="10">⬆ сдвиг +10%</button>
        <button data-mode="around" data-v="5">±5% от цены</button>
        <button data-mode="around" data-v="10">±10% от цены</button>
        <button data-mode="around" data-v="20">±20% от цены</button>
      </div>
      <div class="simform">
        <div><label>Новая нижняя цена</label><input data-role="lo" type="number" step="any" value="${p.lowerPrice.toPrecision(6)}"></div>
        <div><label>Новая верхняя цена</label><input data-role="hi" type="number" step="any" value="${p.upperPrice.toPrecision(6)}"></div>
        <button class="primary" data-role="run">Симулировать</button>
      </div>
      <div data-role="simout"></div>
    </details>
  </div>`;
}

function bindSim(p) {
  const card = document.getElementById("card-" + p.positionAddress);
  if (!card) return;
  const lo = card.querySelector('[data-role="lo"]');
  const hi = card.querySelector('[data-role="hi"]');
  const simout = card.querySelector('[data-role="simout"]');

  card.querySelector('[data-role="quick"]').addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const v = Number(b.dataset.v) / 100;
    if (b.dataset.mode === "shift") {
      lo.value = (p.lowerPrice * (1 + v)).toPrecision(6);
      hi.value = (p.upperPrice * (1 + v)).toPrecision(6);
    } else {
      lo.value = (p.currentPrice * (1 - v)).toPrecision(6);
      hi.value = (p.currentPrice * (1 + v)).toPrecision(6);
    }
  });

  const runBtn = card.querySelector('[data-role="run"]');
  runBtn.onclick = async () => {
    runBtn.disabled = true;
    simout.innerHTML = '<div class="loading"><span class="spin">⟳</span> Считаю…</div>';
    try {
      const res = await fetch("/api/simulate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          positionAddress: p.positionAddress,
          newLowerPrice: Number(lo.value),
          newUpperPrice: Number(hi.value),
        }),
      });
      const sim = await res.json();
      if (!res.ok) throw new Error(sim.error || res.statusText);
      simout.innerHTML = renderSim(p, sim);
    } catch (e) {
      simout.innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
    } finally {
      runBtn.disabled = false;
    }
  };
}

function renderSim(p, s) {
  const dir = s.swap.direction === "none" ? "свап не нужен" :
    `${fmtNum(s.swap.amountIn, 4)} ${esc(s.swap.amountInSymbol)} → ${esc(s.swap.direction === "AtoB" ? p.tokenB.symbol : p.tokenA.symbol)} (${fmtUsd(s.swap.valueUsd)})`;
  return `
  <table class="simres">
    <tr><td>Новый диапазон (по тикам)</td><td>${fmtNum(s.input.lowerPrice, 4)} — ${fmtNum(s.input.upperPrice, 4)}</td></tr>
    <tr><td>Забираем из позиции (+ pending yield ${fmtUsd(s.withdraw.pendingYieldUsd, 4)})</td>
        <td>${fmtNum(s.withdraw.amountA, 4)} ${esc(p.tokenA.symbol)} + ${fmtNum(s.withdraw.amountB, 2)} ${esc(p.tokenB.symbol)}</td></tr>
    <tr><td>Требуемый свап</td><td>${dir}</td></tr>
    <tr><td>— комиссия пула за свап (${p.feeRatePct}%)</td><td class="neg">${fmtUsd(s.costs.swapFeeUsd, 4)}</td></tr>
    <tr><td>— сдвиг цены (импакт ${fmtPct(s.swap.priceImpactPct, 3)})</td><td class="neg">${fmtUsd(s.costs.priceImpactUsd, 4)}</td></tr>
    <tr><td>— сетевые комиссии (~${s.costs.networkFeeSol} SOL)</td><td class="neg">${fmtUsd(s.costs.networkFeeUsd, 4)}</td></tr>
    <tr class="total"><td>Итого издержки ребаланса (мгновенный убыток)</td>
        <td class="neg">${fmtUsd(s.costs.totalUsd, 4)}</td></tr>
    <tr><td>Новая позиция</td>
        <td>${fmtNum(s.next.amountA, 4)} ${esc(p.tokenA.symbol)} + ${fmtNum(s.next.amountB, 2)} ${esc(p.tokenB.symbol)} = ${fmtUsd(s.next.valueUsd)}</td></tr>
    <tr><td>Концентрация ликвидности</td>
        <td>${s.next.concentrationVsCurrent == null ? "н/д" : "×" + s.next.concentrationVsCurrent.toFixed(2) + " к текущей"}</td></tr>
    <tr><td>Оценка дохода в день</td>
        <td>${fmtUsd(s.current.dailyFeesUsd, 4)} → <b class="${cls((s.next.dailyFeesUsd ?? 0) - (s.current.dailyFeesUsd ?? 0))}">${fmtUsd(s.next.dailyFeesUsd, 4)}</b></td></tr>
    <tr><td>Оценка APR</td>
        <td>${fmtPct(s.current.aprPct, 1)} → ${fmtPct(s.next.aprPct, 1)}</td></tr>
    <tr class="total"><td>Окупаемость издержек ростом дохода</td>
        <td>${s.outcome.breakEvenDays == null ? "—" : s.outcome.breakEvenDays.toFixed(1) + " дн."}</td></tr>
  </table>
  <ul class="notes">${s.outcome.note.map(n => `<li>ⓘ ${esc(n)}</li>`).join("")}</ul>`;
}

if (walletInput.value) load();
</script>
</body>
</html>
