# LP-monitor: веб + telegram-бот + headless chrome для скриншотов.
# Версия образов задаётся APP_VERSION (по умолчанию v1):
#   APP_VERSION=v2 docker compose build && APP_VERSION=v2 docker compose up -d
services:
  app:
    build: .
    image: lp-monitor-app:${APP_VERSION:-v1}
    restart: unless-stopped
    ports:
      - "3000:3000" # веб доступен из локальной сети: http://<хост>:3000
    env_file:
      - .env
    volumes:
      - ./data:/app/data # журнал сделок и комментарии — переживают пересборку
      - cache:/app/.cache # кэш свечей

  chrome:
    image: chromedp/headless-shell:151.0.7922.72
    restart: unless-stopped
    init: true
    shm_size: 1gb
    # Только ДОПОЛНИТЕЛЬНЫЕ флаги: run.sh образа сам запускает headless-shell
    # (порт 9223 + socat на 9222) и добавляет наши аргументы в конец.
    # Без HttpsUpgrades навигация на http://app:3000 падала с ERR_SSL_PROTOCOL_ERROR.
    command:
      - --hide-scrollbars
      - --disable-features=HttpsUpgrades,HttpsFirstBalancedModeAutoEnable

  bot:
    build: ./bot
    image: lp-monitor-bot:${APP_VERSION:-v1}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_URL: http://app:3000
      CHROME_WS: ws://chrome:9222
      TZ: ${TZ:-Asia/Bangkok} # «10 утра» ежедневного отчёта — в этом поясе
    depends_on:
      - app
      - chrome

volumes:
  cache:
